services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-raizes}
      POSTGRES_USER: ${POSTGRES_USER:-raizes_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-raizes_pass}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-raizes_user} -d ${POSTGRES_DB:-raizes}" ]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: dev
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-raizes}
      POSTGRES_USER: ${POSTGRES_USER:-raizes_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-raizes_pass}
      JWT_SECRET: ${JWT_SECRET:-dev-only-CHANGE-ME-precisa-de-32-bytes-no-minimo}
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
