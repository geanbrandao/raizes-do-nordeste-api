# Perfil de produção.
#
# Este ambiente não e usado hoje: o projeto roda em dev, e o Dockerfile fixa esse
# perfil. O arquivo existe para a separação de ambientes ficar real em vez de
# teorica, e para deixar explicito o que muda quando a aplicação sai da maquina do
# desenvolvedor.
#
# A regra aqui e uma so: nada de valor padrão para segredo. Toda chave abaixo sem
# default derruba a aplicação no startup se a variavel de ambiente não existir. E de
# proposito. Segredo com default e como fechadura com a chave na porta: funciona, e
# um dia alguem sobe em produção com "dev-only-CHANGE-ME" sem perceber.
spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    show-sql: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    # Impede apagar o schema por acidente a partir da aplicação.
    clean-disabled: true

jwt:
  secret: ${JWT_SECRET}
  access-token-expiration: 900000      # 15 minutos em ms
  refresh-token-expiration: 604800000  # 7 dias em ms

app:
  pagamento:
    # Sem default: webhook sem segredo e porta aberta.
    segredo-callback: ${PAGAMENTO_SEGREDO_CALLBACK}
  verificacao-email:
    # Vazio de proposito e sem possibilidade de sobrescrever por engano: em produção
    # o codigo e sorteado. Enquanto não houver um EnviadorDeEmail real, o codigo não
    # chega a ninguem e um aviso sobe no startup.
    codigo-fixo: ""
    validade-horas: 24
    max-tentativas: 5

springdoc:
  # Documentação interativa fica fora do ar em produção. Ela e ferramenta de
  # desenvolvimento e de avaliação, e publicar o mapa completo da API não ajuda
  # ninguem alem de quem estiver procurando superficie de ataque.
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

management:
  endpoints:
    web:
      exposure:
        # So o health, e sem detalhe: versão de dependencia e estado de componente
        # interno são informação util demais para quem esta sondando.
        include: health
  endpoint:
    health:
      show-details: never

logging:
  level:
    root: WARN
    com.geanbrandao.raizes: INFO
    # Consulta SQL em log de produção vaza dado pessoal dos parametros.
    org.hibernate.SQL: WARN
