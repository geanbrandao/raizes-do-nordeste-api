# Perfil dos testes de integracao: H2 em modo PostgreSQL com as migrations reais
# aplicadas pelo Flyway, inclusive o seed. Assim os testes exercitam o mesmo
# schema e os mesmos dados que a API usa de verdade.
spring:
  datasource:
    url: jdbc:h2:mem:integracao;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      # O ponto do teste: o Hibernate confere as entidades contra o schema que o
      # Flyway criou e quebra se faltar coluna ou o nome estiver diferente.
      ddl-auto: validate
    show-sql: false
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration

jwt:
  secret: segredo-de-teste-comprido-o-bastante-para-hmac-sha256-funcionar
  access-token-expiration: 900000
  refresh-token-expiration: 604800000

app:
  verificacao-email:
    codigo-fixo: "258369"
    validade-horas: 24
    max-tentativas: 5
  pagamento:
    segredo-callback: "segredo-de-teste"
    mock-timeout-ms: 2000
