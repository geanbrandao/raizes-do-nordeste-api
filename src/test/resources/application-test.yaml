spring:
  datasource:
    url: jdbc:h2:mem:testdb;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    open-in-view: false
  flyway:
    enabled: false

jwt:
  secret: segredo-de-teste-comprido-o-bastante-para-hmac-sha256-funcionar
  access-token-expiration: 900000
  refresh-token-expiration: 604800000

rate-limit:
  capacity: 10000
  refill-minutes: 1
